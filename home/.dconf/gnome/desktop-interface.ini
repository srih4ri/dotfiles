[/]
# color-scheme, gtk-theme and icon-theme are left out on purpose: the
# gruvbox-theme-sync service owns them, and loading this file must not
# flip light/dark mode.
accent-color='blue'
clock-show-weekday=true
cursor-size=24
cursor-theme='Bibata-Modern-Classic'
document-font-name='Atkinson Hyperlegible Next 12'
enable-animations=false
enable-hot-corners=true
font-antialiasing='grayscale'
font-hinting='slight'
font-name='Atkinson Hyperlegible Next 11'
gtk-enable-primary-paste=true
monospace-font-name='Atkinson Hyperlegible Mono Medium 12'
scaling-factor=uint32 1
text-scaling-factor=1.0
toolbar-style='text'
