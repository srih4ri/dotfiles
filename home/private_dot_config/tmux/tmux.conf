# --- terminal capabilities ---------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ',*:RGB'           # 24-bit color passthrough
set -g escape-time 10                          # snappy ESC for vim/claude
set -g focus-events on                         # apps know when they're focused
set -g allow-passthrough on                    # inner programs' OSC sequences reach Ptyxis
set -g set-titles on
set -g set-titles-string '#S | #W'
set -g history-limit 100000

# --- mouse + copy-paste (the part the user cares about) ----------------------
set -g mouse on
setw -g mode-keys vi

# Smoother wheel scroll in copy mode (5 lines per tick instead of 1)
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 5 scroll-down

# Drag-select with the mouse copies to the system clipboard via wl-copy
# and exits copy mode. No prefix dance, no manual yank.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind   -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy && tmux display-message 'copied to clipboard'"

# Vi-style keyboard copy also pipes to wl-copy.
bind -T copy-mode-vi v     send-keys -X begin-selection
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "wl-copy && tmux display-message 'copied to clipboard'"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy && tmux display-message 'copied to clipboard'"

# Belt-and-suspenders: also enable OSC 52. If Ptyxis honors it, great;
# wl-copy works regardless.
set -g set-clipboard on

# Middle-click pastes from system clipboard (Wayland-native).
bind -T root MouseDown2Pane run-shell "wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer"

# Toggle mouse off temporarily — useful if Claude Code's mouse interactions
# are being eaten by tmux. Prefix + M.
bind M set -g mouse \; display-message "mouse: #{?mouse,on,off}"

# --- status bar with always-visible cheatsheet ------------------------------
# Catppuccin Mocha accents (foreground-only — bg inherits terminal):
#   blue #89b4fa   mauve #cba6f7   peach #fab387   green #a6e3a1   text #cdd6f4
set -g status 2
set -g status-position bottom
set -g status-style 'bg=default,fg=default'

# Top line of the status block: dim cheatsheet of essential prefix shortcuts.
set -g status-format[0] '#[align=centre,bg=default,fg=brightblack]Ctrl-B then:   " split↓   %% split→   arrows nav   z zoom   c new-win   , rename   d detach   [ copy   ? help'

# Bottom line: session name on the left, window list, time on the right.
set -g status-left  '#[fg=#89b4fa,bold]#S#[nobold,fg=default]  '
set -g status-left-length 30
set -g status-right '#[fg=#cba6f7]%H:%M'
set -g status-interval 5

# Window list (tabs) — current window in peach+bold, inactive in default fg.
set -g status-justify left
setw -g window-status-format         '#[fg=default] #I:#W#{?#{>:#{window_panes},1}, (#{window_panes}),}#{?window_flags,#{window_flags}, } '
setw -g window-status-current-format '#[fg=#fab387,bold] #I:#W#{?#{>:#{window_panes},1}, (#{window_panes}),}#{?window_flags,#{window_flags}, } #[nobold,fg=default]'
setw -g window-status-separator      ''

# prefix ? opens a scrollable cheatsheet popup (overrides default list-keys).
bind ? display-popup -E -w 80% -h 80% "less ~/.config/tmux/cheatsheet.txt"

# prefix r reloads this file (handy when tweaking).
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
