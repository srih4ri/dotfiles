# Kitty configuration for Claude Code notifications

# Remote control - required for hooks to interact with kitty
allow_remote_control yes
listen_on unix:/tmp/kitty-claude-$USER

# Terminal bell settings - for notification alerts
enable_audio_bell yes
window_alert_on_bell yes
visual_bell_duration 0.1
bell_on_tab "🔔 "

# Optional: Run a command when bell occurs (for extra notification)
# command_on_bell notify-send "Kitty" "Bell!"

# Visual bell color (flashes screen briefly)
visual_bell_color #ff5555
