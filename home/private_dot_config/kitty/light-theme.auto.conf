# Gruvbox Daylight: a high-contrast light palette for bright, glare-heavy rooms,
# tuned for strong protan (red-green) colour vision. Every accent is at least
# 5.5:1 against the background in both normal and simulated-protanopia vision
# (Machado 2009). The closest pair as a protan sees it is deltaE 23.5, where the
# stock Gruvbox hues gave 4.4 (green and yellow looked identical). Bright = normal
# on purpose: extra shades would only create pairs that look alike.
# The background is near-white instead of cream, so the panel outshines reflections.
# kitty >= 0.38 loads this automatically when the desktop is in light mode
background #fffcf2
foreground #1d2021
cursor #890ca7
cursor_text_color #fffcf2
selection_background #f2d98a
selection_foreground #1d2021
color0 #ebdbb2
color8 #57524f
color1 #7c100e
color9 #7c100e
color2 #176e3f
color10 #176e3f
color3 #866001
color11 #866001
color4 #0f2261
color12 #0f2261
